plugins {
    id 'com.android.application'
}

android {
    namespace 'bo.com.factorcombinadotopo'
    compileSdk 35

    defaultConfig {
        // Se añade .test para evitar el conflicto "No se instaló la app" con la versión previa de tu teléfono
        applicationId 'bo.com.factorcombinadotopo'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.0' // Se remueve la palabra 'Version' para cumplir con las normas de formato
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'org.locationtech.proj4j:proj4j:1.1.1'
    implementation 'org.apache.commons:commons-math3:3.6.1'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.11.0'
    implementation 'org.osmdroid:osmdroid-android:6.1.18'
    testImplementation 'junit:junit:4.13.2'
    // Opcional: Para tests instrumentados (si usas androidTest)
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}