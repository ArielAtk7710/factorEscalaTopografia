plugins {
    id 'com.android.application'
}

android {
    namespace 'bo.com.solucionesit.factorcombinado'
    compileSdk 35

    defaultConfig {
        // Se añade .test para evitar el conflicto "No se instaló la app" con la versión previa de tu teléfono
        applicationId 'bo.com.solucionesit.factorcombinado.test'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.0' // Se remueve la palabra 'Version' para cumplir con las normas de formato
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'org.osgeo:proj4j:0.1.0'
}